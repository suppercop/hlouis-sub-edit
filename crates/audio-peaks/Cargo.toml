[package]
name = "audio-peaks"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rayon"]
rayon = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
rustfft = "6"
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "audio_peaks"
harness = false

[lints]
workspace = true
