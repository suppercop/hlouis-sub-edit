[package]
name = "version-check"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
egui = { workspace = true, features = ["default_fonts"] }
i18n-catalog = { path = "../i18n-catalog" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.5"
egui_kittest = "0.37.0"

[[bench]]
name = "version_check"
harness = false
