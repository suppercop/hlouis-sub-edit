name: Windows CI

# Windows runners on a private repo cost 2x minutes: run parallel jobs, run once per PR update,
# skip docs-only changes, cancel superseded runs, and build fat-LTO release binary only on main/tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "licenses/**", "tools/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "licenses/**", "tools/**"]
  workflow_dispatch:
    inputs:
      calibrate_ceilings:
        description: "Run all workspace Criterion benches 3 times to calibrate CI ceilings"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.calibrate_ceilings) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-native
        with:
          components: rustfmt, clippy
          cache-prefix: fmt-clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy with -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.calibrate_ceilings) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-native
        with:
          cache-prefix: test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run workspace tests (nextest)
        run: cargo nextest run --workspace --no-fail-fast
      - name: Run workspace doc tests
        run: cargo test --workspace --doc

  bench:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.calibrate_ceilings) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-native
        with:
          cache-prefix: bench
      - name: Restore main benchmark baseline
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: bench-baseline-v1-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            bench-baseline-v1-${{ runner.os }}-
      - name: Run Criterion benchmarks and check regressions + CI ceilings
        shell: pwsh
        run: |
          $isMain = ("${{ github.ref }}" -eq "refs/heads/main") -or ("${{ github.event_name }}" -eq "workflow_dispatch")
          $baseRef = "${{ github.event.pull_request.base.ref }}"
          if ([string]::IsNullOrWhiteSpace($baseRef)) { $baseRef = "main" }
          $pkgSpec = if ($isMain) {
              ./scripts/select-bench-crates.ps1 -All
          } else {
              ./scripts/select-bench-crates.ps1 -BaseRef $baseRef
          }
          $pkgArgs = @($pkgSpec -split '\s+' | Where-Object { $_ -ne '' })
          Write-Host "Benchmarking scope: $($pkgArgs -join ' ')"
          if ($isMain) {
              cargo bench @pkgArgs --bench '*' -- --save-baseline main
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              ./scripts/compare-benches.ps1 `
                  -CurrentBaseline main `
                  -ReferenceBaseline main `
                  -CeilingsPath ci/bench-ceilings.json `
                  -FailOnCeiling `
                  -RecordMedianJson dist/bench-results/medians.json `
                  -OutDir dist/bench-results
          } else {
              cargo bench @pkgArgs --bench '*' -- --save-baseline pr
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              ./scripts/compare-benches.ps1 `
                  -CurrentBaseline pr `
                  -ReferenceBaseline main `
                  -MaxRegressionPct 10.0 `
                  -CeilingsPath ci/bench-ceilings.json `
                  -FailOnCeiling `
                  -RecordMedianJson dist/bench-results/medians.json `
                  -OutDir dist/bench-results
          }
      - name: Save main benchmark baseline cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: bench-baseline-v1-${{ runner.os }}-${{ github.sha }}
      - name: Upload benchmark results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-windows-x64
          path: dist/bench-results/

  calibrate-ceilings:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.calibrate_ceilings == true }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-native
        with:
          cache-prefix: bench
      - name: Run full workspace Criterion benches (calibration run ${{ matrix.run }})
        shell: pwsh
        run: |
          cargo bench --workspace --bench '*' -- --save-baseline cal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/compare-benches.ps1 `
              -CurrentBaseline cal `
              -ReferenceBaseline cal `
              -RecordMedianJson dist/bench-results/medians-run-${{ matrix.run }}.json `
              -OutDir dist/bench-results
      - name: Upload calibration medians
        uses: actions/upload-artifact@v4
        with:
          name: calibration-run-${{ matrix.run }}
          path: dist/bench-results/medians-run-${{ matrix.run }}.json

  release-build:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-native
        with:
          cache-prefix: release-build
      - name: Build release binary
        run: cargo build --release --package hlouis-sub-edit
      - name: Stage release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/licenses | Out-Null
          Copy-Item -Force target/release/hlouis-sub-edit.exe dist/
          Copy-Item -Force .native/bin/*.dll dist/
          Copy-Item -Force .native/licenses/* dist/licenses/
          Copy-Item -Force licenses/* dist/licenses/
          Copy-Item -Force LICENSE dist/
          Copy-Item -Force docs/THIRD_PARTY.md dist/
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hlouis-sub-edit-windows-x64
          path: dist/
